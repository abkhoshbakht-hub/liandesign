<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="novaGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="novaGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Ring -->
  <circle cx="20" cy="20" r="17" stroke="url(#novaGradient1)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6" />
  
  <!-- Angled Orbital Ellipse -->
  <ellipse cx="20" cy="20" rx="16" ry="6" stroke="url(#novaGradient1)" stroke-width="1.8" transform="rotate(-30 20 20)" opacity="0.85" filter="url(#glow)" />
  
  <!-- Core Nova Sphere -->
  <circle cx="20" cy="20" r="8.5" fill="url(#novaGradient1)" />
  <circle cx="18" cy="18" r="4.5" fill="#FFFFFF" fill-opacity="0.35" />

  <!-- Quantum Core Node -->
  <circle cx="20" cy="20" r="2" fill="#FFFFFF" />
  
  <!-- Orbit Node Dot -->
  <circle cx="7" cy="12.5" r="1.5" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="33" cy="27.5" r="1.5" fill="#7C3AED" filter="url(#glow)" />
</svg>
