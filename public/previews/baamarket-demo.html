<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بامارکت — دمو نمونه‌کار لیان دیزاین</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:Tahoma,sans-serif;background:#0b1220;overflow:hidden}
  .bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#111a2e;border-bottom:1px solid #1e293b;color:#e2e8f0}
  .right{display:flex;align-items:center;gap:10px}
  .logo{font-weight:700;font-size:14px;color:#00F5D4}
  .tag{font-size:11px;background:rgba(0,245,212,.12);color:#00F5D4;padding:3px 8px;border-radius:999px}
  .back{font-size:12px;background:#00F5D4;color:#04121f;padding:6px 14px;border-radius:8px;text-decoration:none;font-weight:700}
  .back:hover{background:#22e8c8}
  iframe{width:100%;height:calc(100% - 44px);border:0;display:block}
</style>
</head>
<body>
  <div class="bar">
    <div class="right">
      <span class="logo">لیان دیزاین</span>
      <span class="tag">نمونه‌کار: بامارکت — فروشگاهی</span>
    </div>
    <a class="back" href="/websites">بازگشت به سایت</a>
  </div>
  <iframe src="/previews/baamarket/index.html"></iframe>
</body>
</html>
